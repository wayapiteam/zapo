name: release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch: # Retoma uma publicação parcial sem republicar versões existentes.

permissions: {}

concurrency:
    group: release-publish
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            packages: write

        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - uses: ./.github/actions/setup-node

            - name: use the release npm version
              run: npm install -g npm@11.18.0

            - name: build fork core and SQLite provider
              run: |
                  npm run build
                  npm run build -w packages/store-sqlite

            - name: publish fork packages to GitHub Packages
              run: node scripts/release/publish-fork-packages.cjs
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
